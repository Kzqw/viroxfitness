async function coachRequest(action, payload = {}) {

    method: "POST", headers: { "content-type": "application/json", authorization: "Bearer " + token },
    body: JSON.stringify(payload)

  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || "Coach request failed");

}

async function openCoach() {

async function coachSend() {
  const input = document.getElementById("vx-coach-input");
  if (!input || COACH.busy) return;
  const message = input.value.trim();
  if (!message) return;
  COACH.messages.push({ role: "user", content: message });
  input.value = "";
  COACH.busy = true;
  coachDraw();
  try {
    const data = await coachRequest("chat", { message, threadId: COACH.threadId });
    COACH.threadId = data.threadId;
    COACH.messages.push({ role: "assistant", content: data.reply });
    const status = document.getElementById("vx-coach-status");
    if (status) status.textContent = (data.premium ? "PRO" : "Free plan") + " · " + data.remaining + " messages left today";

}
function coachOpenThread(id) {

(function(){const lab={bell:'Notifications',rmex:'Remove exercise',rmset:'Remove set',done:'Mark set as done',close:'Close',wat:'Add a glass of water',mptog:'Music player'};
function a11y(r){r.querySelectorAll('input:not([aria-label])').forEach(i=>i.setAttribute('aria-label',i.placeholder||'Field'));
r.querySelectorAll('button:not([aria-label])').forEach(b=>{if(!b.textContent.trim()&&lab[b.dataset.a])b.setAttribute('aria-label',lab[b.dataset.a])});

let q=0;new MutationObserver(m=>{if(q||!m.some(x=>[...x.addedNodes].some(n=>n.nodeType==1)))return;q=1;requestAnimationFrame(()=>{q=0;a11y(document)})}).observe(document.getElementById('app'),{childList:true,subtree:true});a11y(document);

</script><script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, onAuthStateChanged, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
const status=document.getElementById("vx-account-status");
const accountButton=()=>document.querySelector('#vx-account [data-a^="vx"]');
let auth=null,currentUser=null,session=null;
async function sessionInfo(user){
  if(!user){session=null;return null}
  const token=await user.getIdToken();
  const response=await fetch("/api/auth-session",{method:"POST",headers:{authorization:"Bearer "+token}});
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(data.error||"Could not verify VIROX account");
  return data;
}
window.VXAuth={
  async signIn(){if(!auth)throw new Error("Firebase is not configured yet.");const provider=new GoogleAuthProvider();provider.setCustomParameters({prompt:"select_account"});await signInWithPopup(auth,provider);},
  async signOut(){if(auth)await signOut(auth)},
  async token(){return currentUser?await currentUser.getIdToken(): ""},
  get session(){return session},
  get user(){return currentUser}
};
try{
  const response=await fetch("/api/public-config",{cache:"no-store"});
  const config=await response.json();
  if(!response.ok)throw new Error(config.error||"Firebase configuration is missing");
  auth=getAuth(initializeApp(config));
  onAuthStateChanged(auth,async user=>{
    currentUser=user;
    const btn=accountButton();
    if(!user){session=null;if(status)status.textContent="Not signed in";if(btn)btn.textContent="Continue with Google";return}
    try{
      session=await sessionInfo(user);
      if(status)status.textContent=session.email+(session.role==="OWNER"?" · OWNER": " · Signed in")+(session.premium?" · PRO":"");
      if(btn){btn.textContent="Sign out";btn.dataset.a="vxsignout"}
    }catch(error){
      if(status)status.textContent=error.message;
      if(btn){btn.textContent="Sign out";btn.dataset.a="vxsignout"}
      await signOut(auth).catch(()=>{});
    }
  });
}catch(error){
  if(status)status.textContent=error.message;
  const btn=accountButton();if(btn){btn.disabled=true;btn.textContent="Account setup required"}
}
</script></body></html>
